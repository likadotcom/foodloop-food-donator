 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoodLoop Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="fixed top-0 left-0 w-full bg-green-700 text-white text-center p-4">
        <h2 class="text-xl font-bold">Welcome to FoodLoop</h2>
    </div>

    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">

        <h1 class="text-3xl font-bold text-green-700 text-center">
            FoodLoop
        </h1>

        <p class="text-gray-500 text-center mt-2 mb-8">
            Food Collection Charity Management
        </p>

        <form>
            <label class="block mb-2">Email Address</label>
            <input
                type="email"
                placeholder="Enter your email"
                class="w-full border p-3 rounded-lg mb-4"
            >

            <label class="block mb-2">Password</label>
            <input
                type="password"
                placeholder="Enter your password"
                class="w-full border p-3 rounded-lg mb-6"
            >

            <button
                type="button"
                class="w-full bg-green-700 text-white p-3 rounded-lg">
                Login
            </button>
        </form>

        <p class="text-center text-gray-500 mt-6">
            Welcome to FoodLoop!
        </p>

    </div>

</body>
</html>
