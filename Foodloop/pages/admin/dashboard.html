
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FoodLoop Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <nav class="bg-green-800 text-white p-4">
        <h1 class="text-2xl font-bold">FoodLoop</h1>
        <p>Food Collection Charity Management</p>
    </nav>

    <main class="p-6">

        <h2 class="text-2xl font-bold mb-6">
            Charity Dashboard
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Food Saved</p>
                <h3 id="foodSaved"
                    class="text-3xl font-bold text-green-700">0 kg</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Completed Collections</p>
                <h3 id="completed"
                    class="text-3xl font-bold">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Pending Collections</p>
                <h3 id="pending"
                    class="text-3xl font-bold">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Registered Users</p>
                <h3 id="users"
                    class="text-3xl font-bold">0</h3>
            </div>

        </div>

        <div class="grid md:grid-cols-3 gap-4 mt-8">

            <a href="users.html"
               class="bg-green-700 text-white p-6 rounded-xl">
                Manage Users
            </a>

            <a href="collections.html"
               class="bg-green-700 text-white p-6 rounded-xl">
                Manage Collections
            </a>

            <a href="reports.html"
               class="bg-green-700 text-white p-6 rounded-xl">
                View Reports
            </a>

        </div>

    </main>

    <script src="/js/app.js"></script>

</body>
</html>
